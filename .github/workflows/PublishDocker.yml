name: Publish Docker

on:
  workflow_run:
    workflows: ["Build and Release"]
    types: [completed]

jobs:
  docker:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Download and Extract Offline Package
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/tinyfilemanager-${TAG}-offline.tar.gz"
          wget -qO- "$URL" | tar -zxv --strip-components=1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/tinyfilemanager
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.workflow_run.head_branch }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.workflow_run.head_branch }}
            type=semver,pattern={{major}},value=${{ github.event.workflow_run.head_branch }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      #- name: Delete old untagged images
      #  uses: actions/delete-package-versions@v5
      #  with:
      #    package-name: 'tinyfilemanager'
      #    package-type: 'container'
      #    min-versions-to-keep: 2
      #    delete-only-untagged-versions: 'true'

      - name: Delete old runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up old workflow runs (keeping only the latest 2)..."
          gh run list --repo ${{ github.repository }} \
            --workflow "${{ github.workflow }}" \
            --limit 200 \
            --json databaseId \
            | jq -r '.[].databaseId' \
            | tail -n +3 \
            | while read id; do
                echo "[INFO] Deleting run: $id"
                gh run delete "$id" --repo ${{ github.repository }} || true
              done